flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: logo.png
  min_sdk_android: 21 # android min sdk min:16, default 21
  image_path_ios: logo.png
  remove_alpha_ios: true

# got replaced by separate yaml file!
# flutter_native_splash:
#   color: "#19235a"
#   image: "logo.png"

flutter:
  assets:
    - assets/images/common/
    - assets/images/ownerchip/
    - assets/images/ownerchip_user/
    - assets/images/stebo/
    - assets/images/ownerchip_infineon/
    - assets/images/stilami/
    - assets/contracts/collection.abi.json
    - assets/contracts/registry.abi.json
    - assets/contracts/forwarder.abi.json
    - assets/contracts/voucher.abi.json
    - assets/contracts/controller.abi.json
    - assets/contracts/erc20.abi.json
    - .env
  generate: true
  uses-material-design: true
  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu-Regular.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/RobotoSlab-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.otf
    - family: Panton
      fonts:
        - asset: assets/fonts/Panton-Regular.ttf