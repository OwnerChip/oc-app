name: ownerchip_whitelabel
description: Connecting physical goods to the blockchain.

publish_to: 'none'

version: 1.5.0+1

environment:
  sdk: '>=2.18.1 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.0
  nfc_manager: ^3.2.0
  web3dart: ^2.4.1
  http: ^1.1.2
  url_launcher: ^6.1.6
  flutter_dotenv: ^5.0.2
  dio: ^5.0.0
  image_picker: ^1.0.7
  flutter_riverpod: ^2.1.1
  flutter_native_splash: ^2.2.16
  flutter_svg: ^2.0.6
  riverpod_annotation: ^2.3.3
  shared_preferences: ^2.1.2
  async: ^2.9.0
  sentry_flutter: ^7.8.0
  sentry_dio: ^7.8.0
  flutter_linkify: ^6.0.0
  walletconnect_flutter_v2: ^2.0.8
  file_picker: ^6.1.1
  pinput: ^3.0.0
  control_style: ^0.1.0
  country_picker: ^2.0.23
  web3modal_flutter: ^3.0.21
  info_popup: ^4.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.2.1
  build_web_compilers: ^4.0.9
  flutter_lints: ^3.0.1
  test: ^1.21.4
  flutter_launcher_icons: ^0.13.1
  riverpod_generator: ^2.3.9


flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: logo.png
  min_sdk_android: 21 # android min sdk min:16, default 21
  image_path_ios: logo.png
  remove_alpha_ios: true

# got replaced by separate yaml file!
# flutter_native_splash:
#   color: "#19235a"
#   image: "logo.png"

flutter:
  assets:
    - assets/images/ownerchip/
    - assets/images/ownerchip_user/
    - assets/images/stebo/
    - assets/images/ownerchip_infineon/
    - assets/images/stilami/
    - assets/contracts/collection.abi.json
    - assets/contracts/registry.abi.json
    - assets/contracts/forwarder.abi.json
    - assets/contracts/voucher.abi.json
    - .env
  generate: true
  uses-material-design: true
  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu-Regular.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/RobotoSlab-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.otf
    - family: Panton
      fonts:
        - asset: assets/fonts/Panton-Regular.ttf