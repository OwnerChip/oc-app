name: owner_chip_admin_demo
description: Connecting physical goods to the blockchain.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.18.1 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.17.0
  cupertino_icons: ^1.0.2
  nfc_manager: ^3.2.0
  web3dart: ^2.4.1
  json_serializable: ^6.4.1
  http: ^0.13.5
  flutter_hooks: ^0.18.5+1
  walletconnect_dart: ^0.0.11
  url_launcher: ^6.1.6
  walletconnect_secure_storage: ^1.0.0
  flutter_dotenv: ^5.0.2
  dio: ^4.0.6
  image_picker: ^0.8.6
  flutter_riverpod: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.2.1
  build_web_compilers: ^3.2.6
  flutter_lints: ^2.0.0
  flutter_launcher_icons: "^0.10.0"

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/oc_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  assets:
    - assets/images/
    - assets/contracts/contract.abi.json
    - .env
  generate: true
  uses-material-design: true
  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu-Regular.ttf